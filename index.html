<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИИ-репетитор</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f6fb;color:#16193a;display:flex;flex-direction:column;height:100dvh}
  header{padding:16px 20px;background:#fff;border-bottom:1px solid #e3e6f0}
  h1{margin:0;font-size:22px}
  .sub{color:#6b7090;font-size:14px;margin-top:4px}
  .chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .chip{background:#e8ecfd;color:#3b4fd8;border:0;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:12px 14px;border-radius:16px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .user{align-self:flex-end;background:#4f5ef0;color:#fff;border-bottom-right-radius:4px}
  .model{align-self:flex-start;background:#fff;border:1px solid #e3e6f0;border-bottom-left-radius:4px}
  .err{align-self:center;color:#c0392b;font-size:14px}
  form{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #e3e6f0}
  textarea{flex:1;resize:none;border:1px solid #d6daea;border-radius:14px;padding:12px;font:inherit;height:48px}
  button.send{background:linear-gradient(90deg,#6c7cff,#a07cf0);color:#fff;border:0;border-radius:14px;padding:0 18px;font-weight:600;font-size:15px}
  button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <h1>ИИ-репетитор</h1>
  <div class="sub">Спроси, что объяснить. Напиши «запомни: …», чтобы ИИ знал о тебе.</div>
  <div class="chips">
    <button class="chip" id="memBtn">Память ИИ (0)</button>
    <button class="chip" id="newBtn">+ Новый разговор</button>
  </div>
</header>

<div id="chat"></div>

<form id="form">
  <textarea id="input" placeholder="Напишите вопрос…"></textarea>
  <button class="send" id="send">→</button>
</form>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const memBtn = document.getElementById('memBtn');

  // localStorage может быть недоступен — оборачиваем
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };

  let history = load('tutor_history', []);
  let memory = load('tutor_memory', []);

  function render() {
    chat.innerHTML = '';
    if (!history.length) add('model', 'Привет! Что хочешь разобрать сегодня?', false);
    history.forEach(m => add(m.role, m.text, false));
    memBtn.textContent = `Память ИИ (${memory.length})`;
  }

  function add(role, text, scroll = true) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = text;
    chat.appendChild(d);
    if (scroll) chat.scrollTop = chat.scrollHeight;
    return d;
  }

  async function send(text) {
    // Команда памяти
    const m = text.match(/^запомни[:,]?\s*(.+)/i);
    if (m) {
      memory.push(m[1].trim()); save('tutor_memory', memory);
      add('user', text);
      add('model', 'Запомнил ✓');
      memBtn.textContent = `Память ИИ (${memory.length})`;
      return;
    }

    history.push({ role: 'user', text });
    add('user', text);
    const thinking = add('model', 'Думаю…');
    sendBtn.disabled = true;

    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history, memory })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Ошибка');
      thinking.textContent = data.reply;
      history.push({ role: 'model', text: data.reply });
      save('tutor_history', history);
    } catch (e) {
      thinking.remove();
      history.pop();
      const er = add('err', '⚠ ' + e.message);
    } finally {
      sendBtn.disabled = false;
      chat.scrollTop = chat.scrollHeight;
    }
  }

  document.getElementById('form').onsubmit = e => {
    e.preventDefault();
    const t = input.value.trim();
    if (!t) return;
    input.value = '';
    send(t);
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('form').requestSubmit(); }
  });

  document.getElementById('newBtn').onclick = () => { history = []; save('tutor_history', history); render(); };
  memBtn.onclick = () => {
    if (!memory.length) return alert('Память пуста. Напиши «запомни: я в 9 классе»');
    if (confirm('ИИ помнит:\n\n• ' + memory.join('\n• ') + '\n\nОчистить память?')) {
      memory = []; save('tutor_memory', memory); render();
    }
  };

  render();
</script>
</body>
</html>
